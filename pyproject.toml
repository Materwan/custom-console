[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-console"
version = "0.6.0"
description = "A custom terminal with custom commands and tools, including a personal AI agent."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ollama>=0.4",
    "prompt_toolkit>=3.0.40",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
# Moodle tools (Playwright browser automation + HTML parsing).
moodle = ["playwright>=1.40", "beautifulsoup4>=4.12"]
# PDF -> Markdown agent tool.
pdf = ["pymupdf4llm>=0.0.17"]
# reMarkable .rmdoc -> PDF with the handwriting drawn on the pages.
rmdoc = ["pymupdf>=1.24", "rmscene>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
custom_console = "custom_console.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
